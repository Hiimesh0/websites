name: Deploy Maa Health Care Therapy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Maa_Health_Care_Therapy/package-lock.json

      - name: Install dependencies
        working-directory: Maa_Health_Care_Therapy
        run: npm ci

      - name: Build site
        working-directory: Maa_Health_Care_Therapy
        run: npm run build

      - name: Copy root redirect
        run: |
          mkdir -p public_site
          cp index.html public_site/index.html
          mkdir -p public_site/Maa_Health_Care_Therapy
          cp -r Maa_Health_Care_Therapy/dist public_site/Maa_Health_Care_Therapy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
