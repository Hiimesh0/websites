name: Deploy Maa Health Care Therapy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MAA-HEALTH-CARE-THERAPY/package-lock.json

      - name: Install dependencies
        working-directory: MAA-HEALTH-CARE-THERAPY
        run: npm ci

      - name: Build site
        working-directory: MAA-HEALTH-CARE-THERAPY
        run: npm run build

      - name: Prepare Site Files
        run: |
          mkdir -p public_site
          # Copy built website directly to root of GitHub Pages
          cp -r MAA-HEALTH-CARE-THERAPY/dist/* public_site/
          # Also support subpaths
          mkdir -p public_site/MAA-HEALTH-CARE-THERAPY/dist
          cp -r MAA-HEALTH-CARE-THERAPY/dist/* public_site/MAA-HEALTH-CARE-THERAPY/dist/
          mkdir -p public_site/docs
          cp -r MAA-HEALTH-CARE-THERAPY/dist/* public_site/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
