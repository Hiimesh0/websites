<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maa Health Care Therapy — Live Demo</title>
  <meta http-equiv="refresh" content="0; url=./Maa_Health_Care_Therapy/dist/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #F8F9F6;
      color: #24312F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      max-width: 540px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      border: 1px solid #E8ECE7;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(20, 91, 88, 0.1);
      color: #145B58;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      color: #145B58;
      margin-bottom: 10px;
    }
    p {
      color: #64748B;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #145B58;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0E4340; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Surat, Gujarat • Heating Therapy Products</div>
    <h1>Maa Health Care Therapy</h1>
    <p>Redirecting you to the live website demo. If not redirected automatically within a few seconds, click the button below:</p>
    <a href="./Maa_Health_Care_Therapy/dist/" class="btn">
      Enter Maa Health Care Website &rarr;
    </a>
  </div>
</body>
</html>
