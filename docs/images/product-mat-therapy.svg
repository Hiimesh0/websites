<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="matFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="thermalZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6A66B" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8BAF9B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C6A66B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="16" fill="#F8F9F6"/>
  <circle cx="300" cy="225" r="210" fill="#EAECE7" fill-opacity="0.5"/>

  <!-- Full Body Flexible Mat (Foldable/Rollable ergonomic presentation) -->
  <rect x="110" y="50" width="380" height="320" rx="14" fill="url(#matFabric)" stroke="#8BAF9B" stroke-width="3"/>

  <!-- Segmented Heat Chambers (Multi-zoned soothing thermal zones) -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4">
    <!-- Zone 1 (Upper Back / Cervical) -->
    <rect x="130" y="70" width="340" height="60" rx="6" fill="url(#thermalZone)"/>
    <text x="300" y="105" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Upper Zone — Cervical & Shoulder Heat</text>

    <!-- Zone 2 (Lumbar / Spine) -->
    <rect x="130" y="145" width="340" height="90" rx="6" fill="url(#thermalZone)"/>
    <text x="300" y="195" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FDE68A" text-anchor="middle">Middle Zone — Lumbar & Spine Relief</text>

    <!-- Zone 3 (Lower Body / Legs) -->
    <rect x="130" y="250" width="340" height="95" rx="6" fill="url(#thermalZone)"/>
    <text x="300" y="305" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Lower Zone — Pelvic & Leg Soothing</text>
  </g>

  <!-- Flexible rolled-up edge indication -->
  <path d="M 110 50 C 130 35 150 50 170 50" stroke="#8BAF9B" stroke-width="2"/>

  <!-- Controller Cord & Multi-level Handheld Unit -->
  <path d="M 470 340 C 510 370 480 410 430 415" stroke="#0F172A" stroke-width="3" fill="none"/>
  <rect x="330" y="392" width="100" height="38" rx="6" fill="#0F172A" stroke="#8BAF9B" stroke-width="1.5"/>
  <circle cx="355" cy="411" r="9" fill="#145B58"/>
  <text x="355" y="415" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">MED</text>
  <!-- Level Indicators -->
  <rect x="375" y="405" width="8" height="12" rx="1" fill="#10B981"/>
  <rect x="387" y="402" width="8" height="15" rx="1" fill="#F59E0B"/>
  <rect x="399" y="399" width="8" height="18" rx="1" fill="#EF4444"/>

  <!-- Badge -->
  <g transform="translate(110, 395)">
    <rect width="190" height="32" rx="6" fill="#145B58"/>
    <text x="95" y="21" font-family="Manrope, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Multi-Level Heating Mat</text>
  </g>
</svg>
